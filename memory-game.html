<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip-Card Memory Game</title>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #1b1f3b;
    --bg2: #2d325f;
    --card-back: linear-gradient(135deg, #6a5cff, #9b5cff);
    --card-front: #ffffff;
    --card-front-text: #1b1f3b;
    --accent: #ffd166;
    --accent-text: #1b1f3b;
    --text: #f4f4ff;
    --stat-bg: rgba(255,255,255,0.08);
    --stat-border: rgba(255,255,255,0.12);
    --win-bg: linear-gradient(135deg, #2d325f, #1b1f3b);
    --overlay-bg: rgba(10, 12, 30, 0.85);
  }

  :root[data-theme="light"] {
    --bg: #eef1fb;
    --bg2: #ffffff;
    --card-back: linear-gradient(135deg, #7c6cff, #b18cff);
    --card-front: #ffffff;
    --card-front-text: #1b1f3b;
    --accent: #f4a723;
    --accent-text: #ffffff;
    --text: #1b1f3b;
    --stat-bg: rgba(27,31,59,0.05);
    --stat-border: rgba(27,31,59,0.12);
    --win-bg: linear-gradient(135deg, #ffffff, #eef1fb);
    --overlay-bg: rgba(60, 66, 110, 0.55);
  }

  * { box-sizing: border-box; }

  body { transition: background 0.3s ease, color 0.3s ease; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at top, var(--bg2), var(--bg));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 1px;
  }
  .subtitle { margin: 0 0 20px; opacity: 0.7; font-size: 0.9rem; }

  /* Scoreboard */
  .stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--stat-bg);
    border: 1px solid var(--stat-border);
    border-radius: 12px;
    padding: 10px 18px;
    min-width: 90px;
    text-align: center;
  }
  .stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
  .stat .value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

  button.restart {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 16px rgba(255,209,102,0.35);
    margin-bottom: 22px;
  }
  button.restart:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,209,102,0.5); }
  button.restart:active { transform: translateY(0); }

  /* 4 columns x 3 rows = 12 cards = 6 pairs */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: min(92vw, 520px);
  }

  .card {
    aspect-ratio: 3 / 4;
    perspective: 1000px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    user-select: none;
  }

  .card-back {
    background: var(--card-back);
    font-size: 1.8rem;
    color: rgba(255,255,255,0.85);
  }

  .card-front {
    background: var(--card-front);
    color: var(--card-front-text);
    transform: rotateY(180deg);
    font-size: clamp(2rem, 8vw, 3rem);
  }

  .card.matched .card-face { box-shadow: 0 0 0 3px var(--accent), 0 8px 18px rgba(0,0,0,0.35); }
  .card.matched { animation: pop 0.4s ease; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Win overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .win-box {
    background: var(--win-bg);
    border: 1px solid var(--stat-border);
    border-radius: 20px;
    padding: 36px 40px;
    text-align: center;
    max-width: 360px;
  }
  .win-box h2 { margin: 0 0 6px; font-size: 2rem; color: var(--accent); }
  .win-box p { margin: 6px 0; opacity: 0.85; }
  .win-box .highlight { color: var(--accent); font-weight: 700; }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--stat-bg);
    border: 1px solid var(--stat-border);
    color: var(--text);
    border-radius: 30px;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.15s ease, background 0.3s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
    <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
  </button>

  <h1>🧠 Flip-Card Memory Game</h1>
  <p class="subtitle">Match all 6 pairs as fast as you can!</p>

  <div class="stats">
    <div class="stat"><div class="label">Time</div><div class="value" id="time">0s</div></div>
    <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
    <div class="stat"><div class="label">Matches</div><div class="value" id="matches">0/6</div></div>
  </div>

  <button class="restart" id="restart">🔄 Restart Game</button>

  <div class="grid" id="grid"></div>

  <div class="overlay" id="overlay">
    <div class="win-box">
      <h2>🎉 You Win!</h2>
      <p>You matched all pairs in <span class="highlight" id="finalTime">0s</span></p>
      <p>with <span class="highlight" id="finalMoves">0</span> moves.</p>
      <button class="restart" id="playAgain">Play Again</button>
    </div>
  </div>

<script>
  const EMOJIS = ["🍎", "🚀", "🌟", "🐶", "🍕", "🎸"]; // 6 pairs
  const grid = document.getElementById("grid");
  const timeEl = document.getElementById("time");
  const movesEl = document.getElementById("moves");
  const matchesEl = document.getElementById("matches");
  const overlay = document.getElementById("overlay");

  let firstCard = null;
  let lockBoard = false;
  let moves = 0;
  let matched = 0;
  let timer = null;
  let seconds = 0;
  let started = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startTimer() {
    if (started) return;
    started = true;
    timer = setInterval(() => {
      seconds++;
      timeEl.textContent = seconds + "s";
    }, 1000);
  }

  function buildBoard() {
    grid.innerHTML = "";
    const deck = shuffle([...EMOJIS, ...EMOJIS]);
    deck.forEach(symbol => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.symbol = symbol;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">❓</div>
          <div class="card-face card-front">${symbol}</div>
        </div>`;
      card.addEventListener("click", () => flipCard(card));
      grid.appendChild(card);
    });
  }

  function flipCard(card) {
    if (lockBoard) return;
    if (card.classList.contains("flipped") || card.classList.contains("matched")) return;

    startTimer();
    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      return;
    }

    // second card flipped -> count a move
    moves++;
    movesEl.textContent = moves;

    if (firstCard.dataset.symbol === card.dataset.symbol) {
      // match
      firstCard.classList.add("matched");
      card.classList.add("matched");
      firstCard = null;
      matched++;
      matchesEl.textContent = matched + "/" + EMOJIS.length;
      if (matched === EMOJIS.length) endGame();
    } else {
      // no match -> flip back after a pause
      lockBoard = true;
      const prev = firstCard;
      setTimeout(() => {
        prev.classList.remove("flipped");
        card.classList.remove("flipped");
        firstCard = null;
        lockBoard = false;
      }, 850);
    }
  }

  function endGame() {
    clearInterval(timer);
    document.getElementById("finalTime").textContent = seconds + "s";
    document.getElementById("finalMoves").textContent = moves;
    setTimeout(() => overlay.classList.add("show"), 600);
  }

  function restart() {
    clearInterval(timer);
    firstCard = null;
    lockBoard = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    started = false;
    timeEl.textContent = "0s";
    movesEl.textContent = "0";
    matchesEl.textContent = "0/" + EMOJIS.length;
    overlay.classList.remove("show");
    buildBoard();
  }

  document.getElementById("restart").addEventListener("click", restart);
  document.getElementById("playAgain").addEventListener("click", restart);

  // --- Theme toggle (light / dark) ---
  const themeIcon = document.getElementById("themeIcon");
  const themeLabel = document.getElementById("themeLabel");

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const dark = theme === "dark";
    themeIcon.textContent = dark ? "🌙" : "☀️";
    themeLabel.textContent = dark ? "Dark" : "Light";
    try { localStorage.setItem("memoryGameTheme", theme); } catch (e) {}
  }

  // Load saved preference, else follow the OS setting
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("memoryGameTheme"); } catch (e) {}
  if (!savedTheme) {
    savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  applyTheme(savedTheme);

  document.getElementById("themeToggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  // init
  buildBoard();
</script>
</body>
</html>
